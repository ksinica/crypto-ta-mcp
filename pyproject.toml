[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-ta-mcp"
version = "0.1.0"
description = "MCP server for cryptocurrency technical analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
crypto-ta-mcp = "crypto_ta_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_ta_mcp"]

